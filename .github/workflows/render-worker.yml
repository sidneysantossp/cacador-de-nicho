name: GitHub Render Workers

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/render-worker.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Check render queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cacadores-render" | jq -r '.value')"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check queued renders
        id: queue
        shell: bash
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          JSON="$(curl -fsS             -H "Authorization: Bearer $TOKEN"             'https://cacadores.159.198.40.98.sslip.io/api/github-render-db/rest/v1/radar_render_jobs?status=eq.queued&select=id&limit=6')"
          COUNT="$(printf '%s' "$JSON" | jq 'length')"
          if [ "$COUNT" -le 0 ]; then
            MATRIX='[]'
          else
            MATRIX="$(seq 1 "$COUNT" | jq -Rsc 'split("\n")[:-1] | map(tonumber)')"
          fi
          echo "Queued renders: $COUNT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  render:
    name: Render slot ${{ matrix.slot }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      DATABASE_API_URL: https://cacadores.159.198.40.98.sslip.io/api/github-render-db
      DATABASE_SERVICE_ROLE_KEY: github-oidc
      RENDER_REMOTE_MEDIA_API_URL: https://cacadores.159.198.40.98.sslip.io/api/github-render-media
      RENDER_WORKER_ONESHOT: '1'
      RENDER_MIN_FREE_DISK_GB: '4'
      RENDER_WORKER_POLL_MS: '2000'
      RENDER_WORKER_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
      APP_COMMIT_SHA: ${{ github.sha }}
      RENDER_WORKER_MEMORY_BYTES: '17179869184'
      RENDER_WORKER_NANO_CPUS: '4000000000'
      GITHUB_OIDC_AUDIENCE: cacadores-render

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          df -h /tmp

      - name: Claim and render one queued master
        run: node scripts/render-worker.mjs
